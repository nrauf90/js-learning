<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity | Cashflow</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Sidebar"></aside>
    <div class="app-overlay" id="app-overlay" aria-hidden="true"></div>

    <div class="app-content">
      <header class="app-topbar no-print">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-heading">
          <h1>Activity</h1>
          <p class="tagline">Who changed what, and when</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="true">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </header>

      <main class="main app-main">
        <div id="activity-alert" class="auth-alert" hidden role="alert"></div>

        <section class="calculator-card">
          <div class="admin-filters activity-filters">
            <label class="activity-filter">
              <span>Person</span>
              <select id="filter-user"><option value="">Everyone</option></select>
            </label>
            <label class="activity-filter">
              <span>Action</span>
              <select id="filter-action">
                <option value="">All actions</option>
                <option value="created">Created</option>
                <option value="updated">Updated</option>
                <option value="deleted">Deleted</option>
                <option value="stock_adjusted">Stock adjusted</option>
              </select>
            </label>
            <label class="activity-filter">
              <span>Type</span>
              <select id="filter-subject">
                <option value="">Everything</option>
                <option value="Product">Products</option>
                <option value="ProductCategory">Categories</option>
              </select>
            </label>
            <label class="activity-filter">
              <span>From</span>
              <input type="date" id="filter-from" />
            </label>
            <label class="activity-filter">
              <span>To</span>
              <input type="date" id="filter-to" />
            </label>
            <button type="button" class="btn btn-secondary pos-mini" id="filter-reset">Clear</button>
          </div>
        </section>

        <section class="calculator-card">
          <h2 class="dashboard-title">Change history</h2>
          <div class="admin-table-container">
            <table class="admin-table activity-table">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Who</th>
                  <th>Action</th>
                  <th>Item</th>
                  <th>Changes</th>
                </tr>
              </thead>
              <tbody id="activity-body">
                <tr><td colspan="5" class="admin-table-empty">Loading…</td></tr>
              </tbody>
            </table>
          </div>

          <div class="admin-pagination" id="activity-pagination"></div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="js/activity.js"></script>
</body>
</html>
