<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Cash Flow | Cashflow</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Sidebar"></aside>
    <div class="app-overlay" id="app-overlay" aria-hidden="true"></div>

    <div class="app-content">
      <header class="app-topbar no-print">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-heading">
          <h1>Daily Cash Flow</h1>
          <p class="tagline">Track income &amp; expenses by category</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </header>

      <main class="main app-main">
      <div id="cashflow-alert" class="auth-alert" hidden role="alert"></div>

      <section class="calculator-card">
        <div class="cashflow-toolbar">
          <div>
            <label class="input-label" for="entry-date">Date</label>
            <input class="auth-input cashflow-date" type="date" id="entry-date" />
          </div>
          <div class="cashflow-totals" id="day-totals" aria-live="polite">
            <span>Income: <strong id="total-income">Rs 0</strong></span>
            <span>Expense: <strong id="total-expense">Rs 0</strong></span>
            <span>Net: <strong id="total-net">Rs 0</strong></span>
          </div>
        </div>
      </section>

      <section class="calculator-card">
        <h2 class="auth-title">Add entry</h2>
        <form id="entry-form" class="cashflow-form" novalidate>
          <input type="hidden" id="entry-id" value="" />

          <div class="cashflow-form-grid">
            <div>
              <label class="input-label" for="entry-type">Type</label>
              <select class="auth-input" id="entry-type" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>
            <div>
              <label class="input-label" for="entry-category">Category</label>
              <select class="auth-input" id="entry-category" required></select>
            </div>
            <div>
              <label class="input-label" for="entry-amount">Amount (PKR)</label>
              <input class="auth-input" type="number" id="entry-amount" min="1" step="0.01" required placeholder="0" />
            </div>
            <div>
              <label class="input-label" for="entry-note">Note</label>
              <input class="auth-input" type="text" id="entry-note" maxlength="500" placeholder="Optional" />
            </div>
          </div>

          <div class="cashflow-form-actions">
            <button type="submit" class="auth-submit cashflow-btn" id="entry-submit">Add entry</button>
            <button type="button" class="auth-google cashflow-btn" id="entry-cancel" hidden>Cancel edit</button>
          </div>

          <div id="receipt-upsell" class="receipt-upsell" hidden>
            <p class="receipt-upsell-label">Attach receipt (Premium)</p>
            <p class="receipt-upsell-text billing-muted">
              Receipt AI scans and enhances expense receipts.
              <a href="billing.html#receipt-addon">Upgrade on Billing</a>
            </p>
          </div>
          <div id="receipt-active" class="receipt-upsell receipt-active" hidden>
            <p class="receipt-upsell-label">Receipt AI</p>
            <p class="receipt-upsell-text billing-muted">Upload coming soon — your add-on is active.</p>
          </div>
        </form>
      </section>

      <section class="calculator-card">
        <h2 class="auth-title">Entries</h2>
        <div id="entries-empty" class="cashflow-empty">No entries for this day yet.</div>
        <ul id="entries-list" class="entries-list"></ul>
      </section>
      </main>
    </div>
  </div>
  <script type="module" src="js/cashflow.js"></script>
</body>
</html>
