<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Sales | Admin | Cashflow</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-overlay" id="app-overlay"></div>
    <div class="app-content">
      <header class="app-topbar no-print">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="topbar-heading"><h1>POS Sales &amp; Refunds</h1><p class="tagline">All till transactions</p></div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
      </header>
      <main class="main app-main">
        <section class="calculator-card">
          <div class="admin-table-header">
            <h2 class="dashboard-title">Sales</h2>
            <select id="status-filter" class="year-select">
              <option value="">All statuses</option>
              <option value="completed">Completed</option>
              <option value="partially_refunded">Partially refunded</option>
              <option value="refunded">Refunded</option>
            </select>
          </div>
          <div class="admin-table-container">
            <table class="admin-table">
              <thead><tr><th>ID</th><th>User</th><th>Total</th><th>Payment</th><th>Status</th><th>Source</th><th>Date</th></tr></thead>
              <tbody id="sales-body"><tr><td colspan="7" class="admin-table-empty">Loading...</td></tr></tbody>
            </table>
          </div>
        </section>
        <section class="calculator-card">
          <h2 class="dashboard-title">Refunds</h2>
          <div class="admin-table-container">
            <table class="admin-table">
              <thead><tr><th>ID</th><th>Sale</th><th>User</th><th>Amount</th><th>Date</th></tr></thead>
              <tbody id="refunds-body"><tr><td colspan="5" class="admin-table-empty">Loading...</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="js/admin-pos-sales.js"></script>
</body>
</html>
