<!--
  PK Galla favicon — the "PK" monogram from logo.png reduced to what still
  reads at 16px: the blue wordmark colour as a solid tile, white letters, and
  the flame swoosh kept as a single orange bar so the brand's second colour
  survives the crop. The full lockup (mark + wordmark + tagline) is far too
  wide to letterbox into a square, so it is deliberately not reused here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PK Galla">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005cef" />
      <stop offset="100%" stop-color="#084194" />
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fd6901" />
      <stop offset="100%" stop-color="#fdb801" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)" />

  <!-- PK monogram, centred optically above the flame bar -->
  <text x="32" y="38"
        font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1.5"
        text-anchor="middle" fill="#ffffff">PK</text>

  <!-- Flame swoosh, flattened to a bar that holds shape at 16px -->
  <rect x="16" y="46" width="32" height="6" rx="3" fill="url(#flame)" />
</svg>
