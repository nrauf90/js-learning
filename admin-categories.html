<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Categories | Admin | PK Galla</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060a14" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Vendored fonts — see vendor/README.md. Previously two preconnects
       plus a stylesheet from Google Fonts; both third-party
       hosts saw every visitor's IP, and a slow or blocked CDN delayed
       first paint. Same-origin now, so the preconnects are moot. -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Sidebar"></aside>
    <div class="app-overlay" id="app-overlay" aria-hidden="true"></div>

    <div class="app-content">
      <header class="app-topbar no-print">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-heading">
          <h1>Categories</h1>
          <p class="tagline">Manage income and expense categories</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </header>

      <main class="main app-main">
        <div id="admin-alert" class="auth-alert" hidden role="alert"></div>

        <div class="admin-top-actions">
          <button type="button" class="btn btn-primary" id="add-category-btn">Add Category</button>
        </div>

        <section class="calculator-card">
          <h2 class="dashboard-title">System Categories</h2>
          <div class="admin-table-container">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Kind</th>
                  <th>Usage Count</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="categories-body">
                <tr>
                  <td colspan="4" class="admin-table-empty">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="admin-modal" id="category-modal" hidden>
    <div class="admin-modal-overlay" id="modal-overlay"></div>
    <div class="admin-modal-content">
      <div class="admin-modal-header">
        <h3 id="modal-title">Category</h3>
        <button type="button" class="admin-modal-close" id="modal-close">&times;</button>
      </div>
      <form id="category-form" class="admin-modal-body">
        <input type="hidden" id="category-id" />
        <div class="form-field">
          <label for="category-name">Name</label>
          <input type="text" id="category-name" required />
        </div>
        <div class="form-field">
          <label for="category-kind">Kind</label>
          <select id="category-kind" required>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="admin-modal" id="delete-modal" hidden>
    <div class="admin-modal-overlay" id="delete-overlay"></div>
    <div class="admin-modal-content admin-modal-small">
      <div class="admin-modal-header">
        <h3>Delete Category</h3>
        <button type="button" class="admin-modal-close" id="delete-close">&times;</button>
      </div>
      <div class="admin-modal-body">
        <p>Are you sure you want to delete category <strong id="delete-category-name"></strong>?</p>
      </div>
      <div class="admin-modal-footer">
        <button type="button" class="btn btn-secondary" id="delete-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin-categories.js"></script>
</body>
</html>
