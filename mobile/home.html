<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PK Galla</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060a14" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/mobile.css" />
  <script src="js/config.js"></script>
  <script src="js/theme-boot.js"></script>
</head>
<body>
  <button type="button" class="m-theme-toggle" id="theme-toggle" aria-label="Change theme" aria-pressed="false">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <!--
    Placeholder. It exists so the splash → login → signed-in flow can be run
    end to end on a real device before any till screen is built, and so login.js
    has a real destination rather than redirecting to itself.
  -->
  <main class="m-auth">
    <div class="m-auth-inner">
      <section class="m-card">
        <img class="m-logo" src="assets/logo.png" alt="PK Galla" />

        <h1 class="m-title">Signed in</h1>
        <p class="m-subtitle" id="home-greeting">Loading your account…</p>

        <div class="m-alert" id="home-alert" hidden role="alert"></div>

        <button type="button" class="m-btn m-btn-secondary" id="logout">
          <span class="m-btn-label">Log out</span>
        </button>

        <p class="m-footer">Khata and Stock screens are next.</p>
      </section>
    </div>
  </main>

  <script type="module" src="js/home.js"></script>
</body>
</html>
