<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Log in | PK Galla</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060a14" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/mobile.css" />
  <script src="js/config.js"></script>
  <script src="js/theme-boot.js"></script>
</head>
<body>
  <!-- A street-facing counter is in direct sun by day and under one bulb at
       night, so following the OS theme is not enough — the shopkeeper needs to
       force it either way. Kept out of the card so it never sits between the
       logo and the form. -->
  <button type="button" class="m-theme-toggle" id="theme-toggle" aria-label="Change theme" aria-pressed="false">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <!-- Vertically centred: .m-auth is a full-height flex box with the card as a
       centred item. The logo is the first child of the card, above the form. -->
  <main class="m-auth">
    <div class="m-auth-inner">
      <section class="m-card">
        <img class="m-logo" src="assets/logo.png" alt="PK Galla — Dukaan Sambhalo, Aasani Se" />

        <h1 class="m-title">Log in</h1>
        <p class="m-subtitle">Your shop's books, in one place.</p>

        <div class="m-alert" id="auth-alert" hidden role="alert"></div>

        <form id="login-form" novalidate>
          <div class="m-field">
            <label class="m-label" for="email">Email</label>
            <input
              class="m-input"
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              inputmode="email"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="next"
            />
          </div>

          <div class="m-field">
            <label class="m-label" for="password">Password</label>
            <!-- Show/hide is not a nicety on a phone: the keyboard hides the
                 field, the characters are masked, and a mistyped password comes
                 back as a generic failure. Being able to look is the difference
                 between one attempt and three. -->
            <div class="m-input-wrap">
              <input
                class="m-input m-input-has-action"
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                enterkeyhint="go"
              />
              <button
                type="button"
                class="m-input-action"
                id="password-toggle"
                aria-controls="password"
                aria-pressed="false"
                aria-label="Show password"
              >
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M3 3l18 18"/><path d="M10.6 6.2A9.9 9.9 0 0112 6c6.5 0 10 6 10 6a17 17 0 01-3.3 3.9M6.5 8.1A17 17 0 002 12s3.5 6 10 6a9.6 9.6 0 003.4-.6"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="m-btn m-btn-primary" id="login-submit">
            <span class="m-btn-label">Log in</span>
          </button>
        </form>

        <!-- No signup link yet: only the splash and login screens are in scope,
             and a link to a screen that does not exist is worse than none.
             Shops are activated by the platform admin anyway (see
             docs/features/dashboard.md), so self-signup on mobile is a product
             decision rather than a missing page. -->
        <p class="m-footer">Need an account? Ask your shop admin.</p>
      </section>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
