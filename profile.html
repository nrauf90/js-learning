<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | PK Galla</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060a14" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Vendored fonts — see vendor/README.md. Previously two preconnects
       plus a stylesheet from Google Fonts; both third-party
       hosts saw every visitor's IP, and a slow or blocked CDN delayed
       first paint. Same-origin now, so the preconnects are moot. -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Sidebar"></aside>
    <div class="app-overlay" id="app-overlay" aria-hidden="true"></div>

    <div class="app-content">
      <header class="app-topbar no-print">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-heading">
          <h1>Profile</h1>
          <p class="tagline">Manage your account &amp; security</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </header>

      <main class="main app-main">
        <div id="profile-alert" class="auth-alert" hidden role="alert"></div>

        <div class="profile-grid">
          <section class="calculator-card">
            <h2 class="dashboard-title">Account details</h2>
            <p class="profile-hint">Your name is shown in the sidebar and on reports.</p>
            <form id="profile-form" class="profile-form" novalidate>
              <div>
                <label class="input-label" for="profile-name">Full name</label>
                <input class="auth-input" type="text" id="profile-name" maxlength="255" required autocomplete="name" />
              </div>
              <div>
                <label class="input-label" for="profile-email">Email</label>
                <input class="auth-input" type="email" id="profile-email" disabled />
                <p class="profile-hint">Email can’t be changed.</p>
              </div>
              <button type="submit" class="auth-submit" id="profile-save">Save changes</button>
            </form>
          </section>

          <section class="calculator-card">
            <h2 class="dashboard-title">Change password</h2>
            <p class="profile-hint">Use at least 8 characters. You’ll stay logged in on this device.</p>
            <form id="password-form" class="profile-form" novalidate>
              <div>
                <label class="input-label" for="current-password">Current password</label>
                <input class="auth-input" type="password" id="current-password" required autocomplete="current-password" />
              </div>
              <div>
                <label class="input-label" for="new-password">New password</label>
                <input class="auth-input" type="password" id="new-password" minlength="8" required autocomplete="new-password" />
              </div>
              <div>
                <label class="input-label" for="confirm-password">Confirm new password</label>
                <input class="auth-input" type="password" id="confirm-password" minlength="8" required autocomplete="new-password" />
              </div>
              <button type="submit" class="auth-submit" id="password-save">Update password</button>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
